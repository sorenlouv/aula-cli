# The gate a contributor runs before pushing, run again on the push itself.
#
# It existed only in release.yml until now, which meant it ran on a version tag
# and nowhere else — a release is far too late to learn that the login page's
# browser client stopped typechecking. That client is the reason this file is
# worth its minute: it lives in its own TypeScript project and is compiled by a
# macro at transpile time, so nothing about it is exercised by importing the
# server. `typecheck` is the only thing that reads it, and `test` is the only
# thing that builds it.
#
# One runner, not a matrix: this checks the source, and release.yml is what
# checks the binaries on each platform they ship for.
name: ci

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Two projects: the server with no DOM, and src/browser with no Bun. The
      # second is the whole point — the root project excludes it, so without
      # this line the TSX would be checked by nothing.
      - run: bun run typecheck
      - run: bun run lint

      # Type-aware linting, a separate pass because it needs a fully typechecked
      # program. It is the only gate that can see String() over an `unknown`
      # rendering an object as the literal text "[object Object]" — six of those
      # were here, one of them turning a fetch URL into "[object Object]" inside
      # a test's own assertion. It also found four `.sort()` calls with no
      # comparator, which sorts numbers lexicographically.
      - run: bun run lint:types

      - run: bun run format:check

      # Spawns `bun build` for the login page's client (src/browser/bundle.ts),
      # so the browser half is compiled here as well as typechecked.
      - run: bun test --timeout 30000 src/ evals/
