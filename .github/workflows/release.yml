# Build the release binaries and attach them to a GitHub release.
#
# The darwin targets are built on macOS rather than cross-compiled, so the
# ad-hoc signature is produced by the platform that will verify it — Apple
# Silicon refuses a binary with no valid signature at all, and that is the one
# failure nobody would see until a user downloaded it.
#
# Asset names are stable on purpose: SETUP.md tells people to curl
# `releases/latest/download/aula-darwin-arm64`, so renaming one breaks the
# documented install.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            targets: 'aula-darwin-arm64 aula-darwin-x64'
          - os: ubuntu-latest
            targets: 'aula-linux-x64 aula-windows-x64.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The gate is the same one a contributor runs before pushing; a release
      # that fails it should never reach a user's machine.
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun test --timeout 30000 src/ evals/

      # On a tag push the tag is the version; a manual run falls back to
      # package.json. See scripts/build.ts.
      - name: Build
        env:
          AULA_BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          for target in ${{ matrix.targets }}; do
            bun run build --target "$target"
          done

      # NOT `codesign --verify`. `bun build --compile` appends the bundle to the
      # end of the signed Bun runtime, so the ad-hoc linker-signed hashes no
      # longer cover the whole file and codesign calls it "modified" — while
      # the kernel loads it happily, which is the only thing that matters here.
      # Running the binary is the real check, so that is what this does.
      #
      # Each job smoke-tests only what it can execute: an arm64 macOS runner
      # cannot run the x64 build without Rosetta, and neither runner can run
      # the Windows one. Everything else gets the architecture assertion below,
      # which is what actually catches a --target typo.
      - name: Smoke-test the native binary
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ./dist/aula-darwin-arm64 version
          else
            chmod +x dist/aula-linux-x64
            ./dist/aula-linux-x64 version
          fi

      # Runs on BOTH jobs. It used to be macOS-only, which meant the Linux and
      # Windows binaries were published with no verification of any kind.
      - name: Check the built architectures
        run: |
          for binary in dist/aula-*; do
            case "$binary" in
              *darwin-arm64) file "$binary" | grep -q 'arm64' ;;
              *darwin-x64)   file "$binary" | grep -q 'x86_64' ;;
              *linux-x64)    file "$binary" | grep -q 'ELF 64-bit.*x86-64' ;;
              *windows-x64*) file "$binary" | grep -qi 'PE32+\|MS Windows' ;;
            esac
            echo "ok: $(file "$binary")"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: dist/
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged
          merge-multiple: true

      # Each job wrote its own SHA256SUMS for its own targets; the release
      # needs one file covering everything that ships.
      - name: Combine the checksums
        run: |
          cd staged
          rm -f SHA256SUMS
          sha256sum aula-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            staged/aula-*
            staged/SHA256SUMS
          generate_release_notes: true
