# Build the release binaries and attach them to a GitHub release.
#
# The darwin targets are built on macOS because `bun build --compile` leaves
# them with a signature that does not match their own bytes, and only codesign
# can repair that. scripts/build.ts re-signs and verifies them; this file just
# has to keep them on a macOS runner.
#
# Asset names are stable on purpose: SETUP.md tells people to curl
# `releases/latest/download/aula-darwin-arm64`, so renaming one breaks the
# documented install.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            targets: 'aula-darwin-arm64 aula-darwin-x64'
          - os: ubuntu-latest
            targets: 'aula-linux-x64 aula-windows-x64.exe'
    runs-on: ${{ matrix.os }}
    steps:
      # Every action pinned here runs on Node 24. The runner had started
      # force-migrating the old Node 20 pins and warning on every run, which is
      # a deprecation with a deadline attached. Note the major numbers are not
      # in step: setup-bun is still v2 because v2 is already a node24 action.
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The gate is the same one a contributor runs before pushing; a release
      # that fails it should never reach a user's machine.
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run lint:types
      - run: bun run format:check
      - run: bun test --timeout 30000 src/ evals/

      # On a tag push the tag is the version; a manual run falls back to
      # package.json. See scripts/build.ts.
      - name: Build
        env:
          AULA_BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          for target in ${{ matrix.targets }}; do
            bun run build --target "$target"
          done

      # Running the binary is NOT sufficient on macOS, and this workflow used to
      # say the opposite: it dismissed `codesign --verify` as a false alarm
      # because the kernel loaded the binary anyway. The kernel validates code
      # pages lazily, so "it started on the build machine" says nothing about a
      # user's Mac — v0.3.1 passed this smoke test and was then SIGKILLed with
      # "Code Signature Invalid" on the first Mac that tried to install it.
      # scripts/build.ts now signs and verifies; the step below is the backstop
      # that fails the release if that ever stops happening.
      #
      # Each job smoke-tests only what it can execute: an arm64 macOS runner
      # cannot run the x64 build without Rosetta, and neither runner can run
      # the Windows one. Everything else gets the architecture assertion below,
      # which is what actually catches a --target typo.
      - name: Smoke-test the native binary
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ./dist/aula-darwin-arm64 version
          else
            chmod +x dist/aula-linux-x64
            ./dist/aula-linux-x64 version
          fi

      # Both darwin binaries, including the x64 one no runner here can execute.
      # --strict is the point: it is what refuses a signature whose hashes do
      # not cover the bytes on disk.
      - name: Verify the macOS signatures
        if: runner.os == 'macOS'
        run: |
          for binary in dist/aula-darwin-*; do
            codesign --verify --strict --verbose=2 "$binary"
          done

      # Runs on BOTH jobs. It used to be macOS-only, which meant the Linux and
      # Windows binaries were published with no verification of any kind.
      - name: Check the built architectures
        run: |
          for binary in dist/aula-*; do
            case "$binary" in
              *darwin-arm64) file "$binary" | grep -q 'arm64' ;;
              *darwin-x64)   file "$binary" | grep -q 'x86_64' ;;
              *linux-x64)    file "$binary" | grep -q 'ELF 64-bit.*x86-64' ;;
              *windows-x64*) file "$binary" | grep -qi 'PE32+\|MS Windows' ;;
            esac
            echo "ok: $(file "$binary")"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}
          path: dist/
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: staged
          merge-multiple: true

      # Each job wrote its own SHA256SUMS for its own targets; the release
      # needs one file covering everything that ships.
      - name: Combine the checksums
        run: |
          cd staged
          rm -f SHA256SUMS
          sha256sum aula-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            staged/aula-*
            staged/SHA256SUMS
          generate_release_notes: true
